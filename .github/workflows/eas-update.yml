name: Publish EAS OTA Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: "OTA update message"
        required: false
        default: "Publish OTA update"
      runtime_version:
        description: "Optional runtime version to target, e.g. 0.4.0"
        required: false
        default: ""

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  publish:
    name: Publish Android OTA update
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Sync public app configuration to EAS production environment
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const easConfig = require('./eas.json');
          const variables = Object.entries(easConfig.build?.production?.env ?? {})
            .filter(([name, value]) => name.startsWith('EXPO_PUBLIC_') && typeof value === 'string' && value.length > 0);
          if (variables.length === 0) throw new Error('No public production variables found in eas.json');
          for (const [name, value] of variables) {
            console.log(`Syncing ${name} to the EAS production environment`);
            execFileSync('eas', ['env:set', '--name', name, '--value', value, '--environment', 'production', '--visibility', 'plaintext', '--non-interactive'], { stdio: 'inherit' });
          }
          NODE

      - name: Override OTA runtime version when requested
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runtime_version != '' }}
        env:
          TARGET_RUNTIME_VERSION: ${{ github.event.inputs.runtime_version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.TARGET_RUNTIME_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('runtime_version must use semantic version format, e.g. 0.4.0');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.runtimeVersion = version;
          fs.writeFileSync('app.json', `${JSON.stringify(config, null, 2)}\n`);
          console.log(`Targeting OTA runtime ${version}`);
          NODE

      - name: Publish production OTA update
        env:
          UPDATE_MESSAGE: ${{ github.event.inputs.message || format('OTA update from {0}', github.sha) }}
        run: >-
          eas update
          --channel production
          --environment production
          --platform android
          --message "$UPDATE_MESSAGE"
          --non-interactive
