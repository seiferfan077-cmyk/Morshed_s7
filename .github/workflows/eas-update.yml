name: Publish EAS OTA Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: "OTA update message"
        required: false
        default: "Publish OTA update"

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  publish:
    name: Publish Android OTA update
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish production OTA update
        env:
          UPDATE_MESSAGE: ${{ github.event.inputs.message || format('OTA update from {0}', github.sha) }}
        run: >-
          eas update
          --channel production
          --environment production
          --platform android
          --message "$UPDATE_MESSAGE"
          --non-interactive
