name: Diagnose EAS Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "EAS build ID"
        required: true
        default: b56f6f54-93b0-4c36-9e2c-1eac93fa0622

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Install log decompression support
        run: python3 -m pip install --user brotli
      - name: Read EAS build details
        run: |
          eas build:view "${{ inputs.build_id }}" --json > /tmp/eas-view.txt
          python3 - <<'PY'
          import brotli
          import bz2
          import gzip
          import json
          import lzma
          import pathlib
          import urllib.request
          import zipfile
          import zlib
          text = open('/tmp/eas-view.txt', encoding='utf-8').read()
          data = json.loads(text[text.find('{'):])
          url = data['logFiles'][0]
          response = urllib.request.urlopen(url)
          raw = response.read()
          print(f"log_url={url}")
          print(f"content_type={response.headers.get('content-type')}")
          print(f"content_encoding={response.headers.get('content-encoding')}")
          print(f"raw_size={len(raw)} raw_magic={raw[:32].hex()}")

          decoded = None
          decoders = [
              ('brotli', lambda value: brotli.decompress(value)),
              ('gzip', lambda value: gzip.decompress(value)),
              ('zlib', lambda value: zlib.decompress(value)),
              ('deflate-raw', lambda value: zlib.decompress(value, -15)),
              ('bz2', lambda value: bz2.decompress(value)),
              ('lzma', lambda value: lzma.decompress(value)),
          ]
          for name, decoder in decoders:
              try:
                  candidate = decoder(raw)
                  if candidate and (b'Gradle' in candidate or b'FAILURE' in candidate or b'Execution failed' in candidate or candidate[:1] in (b'{', b'[', b'\n')):
                      decoded = candidate
                      print(f"decoder={name} decoded_size={len(candidate)} decoded_magic={candidate[:32].hex()}")
                      break
              except Exception:
                  continue
          if decoded is None:
              try:
                  pathlib.Path('/tmp/eas-log.bin').write_bytes(raw)
                  with zipfile.ZipFile('/tmp/eas-log.bin') as archive:
                      decoded = b'\n'.join(archive.read(item) for item in archive.namelist())
              except Exception:
                  decoded = raw
          raw = decoded
          log = raw.decode('utf-8', errors='replace')
          lines = log.splitlines()
          keywords = ('FAILURE', 'What went wrong', 'Execution failed', 'error:', 'Error:', 'Could not', 'A problem occurred')
          selected = [line for line in lines if any(keyword.lower() in line.lower() for keyword in keywords)]
          print('\n'.join(selected[-120:]))
          print('\n--- LAST LOG LINES ---')
          print('\n'.join(lines[-80:]))
          PY
