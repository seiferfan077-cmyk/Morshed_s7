name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run media and SQLite regression checks
        run: |
          npm run typecheck
          npm run media:vault:test
          npm run media:worker:test
          npm run sqlite:recovery:test

      - name: Validate Firebase Android configuration
        run: |
          python3 - <<'PY'
          import json
          with open("google-services.json", encoding="utf-8") as source:
              config = json.load(source)
          client = config["client"][0]
          if config["project_info"]["project_id"] != "chat-5e935":
              raise SystemExit("Firebase project mismatch")
          if client["client_info"]["android_client_info"]["package_name"] != "com.murshid.s7":
              raise SystemExit("Android package mismatch")
          print("Firebase Android configuration validated.")
          PY

      - name: Build Android APK
        run: eas build --platform android --profile "${{ inputs.profile }}" --non-interactive
